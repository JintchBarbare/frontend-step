<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Catalog</title>
    <script src="app.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 24px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 16px;
            display: flex;
            flex-direction: column;
        }
        .product-card img {
            width: 100%;
            height: 160px;
            object-fit: contain;
            margin-bottom: 12px;
        }
        .product-card h3 {
            font-size: 16px;
            margin: 0 0 8px;
        }
        .product-card p {
            font-size: 13px;
            color: #555;
            margin: 0 0 8px;
            flex-grow: 1;
        }
        .erro_msg {
            text-align: center;
            color: #d33;
            font-weight: bold;
            margin-top: 20px;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 12px;
            max-width: 700px;
            margin: 0 auto 32px;
        }
        
        .filter, .category-filter {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
        }

        .filter {
            flex: 1;
        }

        .category-filter {
            min-width: 180px;
            cursor: pointer;
            text-transform: capitalize;
        }
    </style>
</head>
<body>

    <div class="filters">
        <input type="text" class="filter" placeholder="Search products...">
        <select class="category-filter">
            <option value="all">All Categories</option>
        </select>
    </div>

    <section>
        <div class="container"></div>
        <div class="erro_msg"></div>
    </section>

</body>
</html>
