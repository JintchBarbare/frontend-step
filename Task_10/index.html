<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Card Layout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="hero-visual">
        <div class="doctor-card-wrapper">

            <div class="arch-outline"></div>

            <div class="arch-image-box">
                <img src="https://images.unsplash.com/photo-1594824476967-48c8b964273f?auto=format&fit=crop&w=800&q=80" alt="Doctor">
            </div>

            <div class="floating-badge badge-urgent">
                <span class="badge-label">NEED URGENT CARE?</span>
                <div class="badge-content">
                    <svg class="icon-phone" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.46.57 3.58a1 1 0 01-.25 1.01l-2.2 2.2z"/>
                    </svg>
                    <a href="tel:0422277303" class="phone-number">0422 277 303</a>
                </div>
            </div>

            <div class="floating-badge badge-trust">
                <div class="trust-item">
                    <!-- საათის აიქონი -->
                    <svg class="icon-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="9"></circle>
                        <polyline points="12 7 12 12 15 14"></polyline>
                    </svg>
                    <span>24/7</span>
                </div>

                <div class="divider"></div>

                <div class="trust-item">
                    <svg class="icon-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                    <span>Trusted care</span>
                </div>
            </div>

            <div class="floating-badge badge-available">
                <div class="status-dot-wrapper">
                    <span class="status-dot"></span>
                </div>
                <div class="available-info">
                    <span class="badge-label">NEXT AVAILABLE</span>
                    <span class="available-time">Today &bull; 14:30</span>
                </div>
            </div>

        </div>
    </section>

</body>
</html>
