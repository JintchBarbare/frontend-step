<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .user-card {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 300px;
        }

        .avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 18px;
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #e2e8f0;
        }

        /* სტატუსის წრე ავატარის თავზე */
        .status-dot {
            position: absolute;
            top: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .status-online {
            background-color: #22c55e; /* მწვანე */
        }

        .status-offline {
            background-color: #ef4444; /* წითელი */
        }

        h2 {
            margin: 0 0 6px;
            font-size: 20px;
            color: #1e293b;
        }

        .email {
            margin: 0 0 16px;
            font-size: 14px;
            color: #64748b;
        }

        .role-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            background-color: #e0e7ff;
            color: #3730a3;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background-color: #334155;
            color: white;
            cursor: pointer;
            font-size: 13px;
        }

        button:hover {
            background-color: #1e293b;
        }
    </style>
</head>
<body>

    <div id="app"></div>

    <div class="controls">
        <button id="toggle-login">სტატუსის შეცვლა</button>
        <button id="toggle-role">როლის შეცვლა</button>
    </div>

    <script type="module">
        import { User } from './User.js';
        import { UserConfig } from './UserConfig.js';

        const currentUser = new User(
            "donald trump",
            "trump@example.com",
            "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRWnvlB5ZQ42xubQgDXuZZ9p59ktQ-nEcc5fr_hL1wbMw&s=10",
            UserConfig.isAdmin,
            UserConfig.isLoggedIn
        );

        const app = document.getElementById('app');

        function renderUser(user) {
            const isOnline = user.checkLoggedIn();
            const roleText = user.getRole();

            app.innerHTML = `
                <div class="user-card">
                    <div class="avatar-wrapper">
                        <span class="status-dot ${isOnline ? 'status-online' : 'status-offline'}"></span>
                        <img src="${user.avatar}" alt="${user.name}">
                    </div>
                    <h2>${user.name}</h2>
                    <p class="email">${user.email}</p>
                    <span class="role-badge">${roleText}</span>
                </div>
            `;
        }

        renderUser(currentUser);

        document.getElementById('toggle-login').addEventListener('click', () => {
            currentUser.isLoggedIn = !currentUser.isLoggedIn;
            renderUser(currentUser);
        });

        document.getElementById('toggle-role').addEventListener('click', () => {
            currentUser.isAdmin = !currentUser.isAdmin;
            renderUser(currentUser);
        });
    </script>

</body>
</html>
